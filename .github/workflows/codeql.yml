# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# A repo that adds a compiled language names it in `languages` — the body sets
# the build mode per language, so Go needs no second workflow.
name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '34 23 * * 0'
  workflow_dispatch:

jobs:
  codeql:
    name: CodeQL
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: kirchDev/workflows/.github/workflows/_codeql.yml@aa8e987 # v0.1.0
