# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# A repo that publishes something adds its own job here, gated on
# `needs.release-please.outputs.release-created`.
name: Release Please

on:
  push:
    branches:
      - main

jobs:
  release-please:
    name: Release Please
    permissions:
      contents: write
      pull-requests: write
    uses: kirchDev/workflows/.github/workflows/_release-please.yml@f47f598f549a3c97924fdfd00f15371ea557e1aa # v0.1.1
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
