# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# The checks come from this repo's own `check` script in package.json — adding
# one there is enough, no workflow change needed.
name: CI

on:
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check:
    name: CI
    uses: kirchDev/workflows/.github/workflows/_ci-check.yml@aa8e987 # v0.1.0
