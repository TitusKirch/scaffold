# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# The checks come from this repo's own `check` script in package.json — adding
# one there is enough, no workflow change needed.
name: CI

on:
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened, ready_for_review]
    # A change touching only prose cannot break a lint or a typecheck. Workflows
    # are NOT excluded — a repo whose gate lints them needs them to trigger.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - LICENSE

permissions:
  contents: read

jobs:
  check:
    name: CI
    uses: kirchDev/workflows/.github/workflows/_ci-check.yml@f47f598f549a3c97924fdfd00f15371ea557e1aa # v0.1.1
